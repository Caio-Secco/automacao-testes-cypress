name: CI

on: [push]
jobs:
    build-test:
        runs-on: ubuntu
        steps:

          - name: Checkout
            uses: actions/Checkout@v3

          - name: Cypress tests
            uses: cypress-io/github-actions@v5
            with:
            
          - uses: actions/upload-artifact@v3
            if: always()
            with:
              name: Cypress Result
              path:
                  cypress/screenshot
                  cypress/videos
                  cypress/results
              if-no-files-found: ignore